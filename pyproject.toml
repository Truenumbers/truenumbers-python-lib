[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "truenumbers-python-lib"
version = "0.0.16"
description = "Python client libraries for Truenumbers REST, Trigger, and Artifact APIs"
readme = "README.md"
requires-python = ">=3.7"
dependencies = [
    "requests>=2.20",
]
keywords = ["truenumbers", "rest", "api", "client"]

[tool.setuptools.packages.find]
where = ["src"]
